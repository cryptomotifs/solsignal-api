name: Keep Private Alpha Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        target:
          - https://cipher-private-alpha.onrender.com/health
          - https://cipher-private-alpha-canary.onrender.com/health
    steps:
      - name: Ping Private Alpha health
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 45 "${{ matrix.target }}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
